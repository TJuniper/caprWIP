services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    entrypoint:
      - flask
      - run
      - --host=0.0.0.0
    environment:
      FLASK_DEBUG: 1
      FLASK_APP: server
    ports:
      - 5001:5000
    volumes:
      - ./backend:/usr/app                   # Backend code
      - ./Celtic/data:/usr/app/data
      - ./Celtic/fsts:/usr/app/fsts
      - ./Celtic/tools:/usr/app/tools
      - ./Celtic/docs:/usr/app/docs
    depends_on:
      - frontend
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - ./frontend:/usr/app